<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="index.js" defer></script>
</head>

<body>
    <main>
        <h1>Rock Paper Scissors</h1>
        <p id="score">You: 0 | Computer: 0</p>
        <div id="choices">
            <button id="rock" type="button">Rock</button>
            <button id="paper" type="button">Paper</button>
            <button id="scissors" type="button">Scissors</button>
        </div>
        <div id="results" aria-live="polite">Choose a move to start the game.</div>
    </main>
</body>

</html>
